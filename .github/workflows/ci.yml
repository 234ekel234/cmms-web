# Every push and pull request: typecheck, then a production build — the same
# `next build` Vercel runs, so a commit that would fail to deploy fails here
# first, with the error in front of whoever pushed it.
#
# Lint is blocking: the react-hooks backlog that predated CI was cleared on
# 27 Oct 2026, so a new error fails the job rather than joining a pile.
name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_API_URL: https://cmms-api.servicemasterph.com/api
      NEXT_TELEMETRY_DISABLED: 1

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
