# Nginx for the FMI HANNI web client on the droplet.
#
#   hanni.servicemasterph.com  -> Next on 127.0.0.1:3001 (deploy/ecosystem.config.cjs)
#   cmms.servicemasterph.com   -> permanent redirect to the same path on hanni.
#
# The redirect must stay for good. Every QR sticker and asset label printed
# before the rename encodes https://cmms.servicemasterph.com/..., and so does
# every email already sent. Remove this block and all of them stop working.
#
# Install (☁️ droplet; backend DEPLOY.md §16 is the full runbook):
#   sudo cp deploy/nginx-hanni.conf /etc/nginx/sites-available/hanni
#   sudo ln -s /etc/nginx/sites-available/hanni /etc/nginx/sites-enabled/hanni
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d hanni.servicemasterph.com -d cmms.servicemasterph.com

server {
    listen 80;
    listen [::]:80;
    server_name hanni.servicemasterph.com;

    # Pages only; uploads go straight to the API (cmms-api.), which has its own limit.
    client_max_body_size 2m;

    # Next's hashed build files never change under a name, so browsers may keep
    # them for a year. Next sets this header itself; repeating it here keeps it
    # if a proxy in between strips it.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name cmms.servicemasterph.com;

    # Path and query kept: /r/AB12CD?x=1 lands on hanni.../r/AB12CD?x=1.
    return 301 https://hanni.servicemasterph.com$request_uri;
}
